server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/hbplus}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-stacktrace=never
app.google-client-ids=${GOOGLE_CLIENT_IDS}
app.allowed-domain=${ALLOWED_DOMAIN:hbplus.fit}
app.admin-emails=${ADMIN_EMAILS:}
app.frontend-origins=${FRONTEND_ORIGINS:http://localhost:8081}
